name: Hourly Parking Availability Logger

on:
  schedule:
    # Runs automatically at minute 0 of every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Enables manual triggering from GitHub UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scraper Script
        run: python scraper.py

      - name: Save CSV Changes Back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add parking_data.csv
          git commit -m "Auto-update parking logs" || exit 0
          git push
